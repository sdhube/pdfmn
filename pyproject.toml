[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftui"
version = "0.1.0"
description = "Crawl a directory for PDFs and maintain a books manifest (json / yaml / sqlite)."
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "windows-curses>=2.3; sys_platform == 'win32'",
]
# backend (pdfpz) is a git submodule pinned to v0.6.0, not a package-index dep: `pip install -e ./backend -e .` (see run_app.sh).

[project.scripts]
pdftui = "pdftui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
